<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ボールパーク・オーナーズ 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9EEE4;--ink:#16301F;--muted:#5B6F60;--card:#F7F9F3;--line:#C9D3C2;--board:#1E3A2A;--chalk:#F3F1E6;--lamp:#F2B33D;--dirt:#A8562A;--neg:#B3261E;--dot:"DotGothic16","MS Gothic",monospace;--body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1C14;--ink:#E6EDE3;--muted:#93A897;--card:#172A1E;--line:#2C4435;--board:#0A1510;--chalk:#EDEBDD;--lamp:#F5BE52;--dirt:#D07A45;--neg:#FF8A80}}
:root[data-theme="dark"]{--bg:#0F1C14;--ink:#E6EDE3;--muted:#93A897;--card:#172A1E;--line:#2C4435;--board:#0A1510;--chalk:#EDEBDD;--lamp:#F5BE52;--dirt:#D07A45;--neg:#FF8A80}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--body);padding-bottom:72px}
#app{max-width:640px;margin:0 auto}
header{background:var(--board);color:var(--chalk);padding:12px 16px 10px;position:sticky;top:0;z-index:5}
.tn{font:22px/1.2 var(--dot);color:var(--lamp);letter-spacing:.04em}
.hs,.hk{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;margin-top:4px}.hk b{font-family:var(--dot);font-weight:400;font-size:15px;color:var(--lamp)}.hk b.neg{color:#FF8A80}
main{padding:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--board);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--chalk);opacity:.65;padding:14px 0;font:14px var(--body);border-top:3px solid transparent;border-radius:0}
nav button.on{opacity:1;border-top-color:var(--lamp);color:var(--lamp)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin:0 0 12px}
.card.lead{border-left:5px solid var(--dirt)}
h1,h2,h3{font-family:var(--dot);font-weight:400;margin:0 0 8px;line-height:1.3}h2{font-size:20px}h3{font-size:16px}
p{margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:13px}.mine{color:var(--dirt);font-weight:700}.neg{color:var(--neg)}
button{font:14px var(--body);background:var(--ink);color:var(--bg);border:0;border-radius:4px;padding:10px 14px;cursor:pointer;min-height:40px}
button.alt{background:var(--dirt);color:#fff}button.ghost{background:none;color:var(--ink);border:1px solid var(--line);min-height:32px;padding:6px 10px;font-size:13px}
button:disabled{opacity:.35}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.row button{flex:1 1 auto}
.hero{padding:40px 8px 18px}.hero h1{font-size:40px;color:var(--ink)}.hero h1 span{display:block;font-size:64px;color:var(--dirt);line-height:1}
.fl{display:block;margin-bottom:12px;font-size:13px;color:var(--muted)}.fl input,.fl select{display:block;width:100%;margin-top:4px;font:16px var(--body);padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.board{background:var(--board);color:var(--chalk);border-radius:6px;padding:12px 10px;margin:0 0 12px;overflow-x:auto}
.board table{border-collapse:collapse;font-family:var(--dot);width:100%;min-width:340px}.board th{font-weight:400;font-size:11px;opacity:.6;padding:2px}
.board td{text-align:center;font-size:18px;color:var(--lamp);padding:3px 2px;border-bottom:1px solid rgba(255,255,255,.08)}.board td.bn{text-align:left;font-size:13px;color:var(--chalk);white-space:nowrap}.board td.rt{color:#fff;font-size:20px}
.bi{font-size:12px;margin-top:8px;opacity:.85}
.rk{display:flex;align-items:baseline;gap:14px;margin-bottom:8px}.big{font:44px/1 var(--dot);color:var(--dirt)}.big small{font-size:16px}.big2{font:22px var(--dot)}
.log p{margin:0;padding:6px 2px;border-bottom:1px dashed var(--line);font-size:13px}
.pl{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px}.pl.inj{opacity:.6}
.pl .top{display:flex;align-items:baseline;gap:8px}.nm{font-weight:700;font-size:16px}.nm small{font-size:10px;font-weight:400;margin-left:5px;padding:1px 4px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.meta{font-size:12px;color:var(--muted)}.ov{margin-left:auto;font:24px/1 var(--dot);color:var(--dirt)}
.abs{display:flex;gap:6px;margin:6px 0 4px;flex-wrap:wrap}.ab{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--muted)}.ab i{font-style:normal}
.ab b{font:15px/1 var(--dot);width:22px;height:22px;display:inline-grid;place-items:center;border-radius:3px;color:#fff}
.gS{background:#C0392B}.gA{background:#D9632B}.gB{background:#C98A1A}.gC{background:#6E9A2F}.gD{background:#3F8A6B}.gE{background:#3D6E92}.gF{background:#5E6680}.gG{background:#7A7A7A}
.sub{font-size:12px;color:var(--muted)}.bot{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px}.acts{margin-left:auto;display:flex;gap:6px}.acts button{min-height:34px;padding:6px 10px;font-size:13px}
.seg{display:flex;gap:0;margin-bottom:8px;border:1px solid var(--line);border-radius:5px;overflow:hidden}.seg button{flex:1;background:var(--card);color:var(--ink);border-radius:0}.seg button.on{background:var(--ink);color:var(--bg)}.seg.sm button{min-height:34px;padding:6px}
.act{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}.act input{width:20px;height:20px;margin-top:2px;flex:none}.act small{color:var(--muted)}
.sl{display:block;margin:8px 0}.sl input{width:100%}
.tw{overflow-x:auto}.tb{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}.tb th{font-weight:400;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line)}.tb td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--line)}.tb .l{text-align:left}
.steps{display:flex;list-style:none;padding:0;margin:0 0 12px;gap:4px;counter-reset:s}.steps li{flex:1;font-size:10px;text-align:center;color:var(--muted);border-top:4px solid var(--line);padding-top:4px}.steps li.done{border-color:var(--muted)}.steps li.on{border-color:var(--dirt);color:var(--ink);font-weight:700}
details{margin:6px 0 10px}summary{cursor:pointer;font-size:14px}
.reset{text-align:center}
#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);background:var(--lamp);color:#1b1b1b;padding:10px 16px;border-radius:4px;opacity:0;pointer-events:none;transition:.25s;z-index:9;font-weight:700}#toast.on{opacity:1;transform:translate(-50%,0)}
.tm{font-size:11px;padding:1px 6px;border-radius:3px;background:var(--board);color:var(--chalk)}
.nsk input{width:76px;flex:0 0 76px;font:16px var(--body);padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.wide{width:100%;margin-top:8px}.tsel{width:100%;font:15px var(--body);padding:9px;margin-bottom:8px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink)}
.inv{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line)}.inv small{color:var(--muted)}
a.btn{display:inline-grid;place-items:center;flex:1 1 auto;min-height:40px;padding:10px 14px;border-radius:4px;background:#111;color:#fff;text-decoration:none;font-size:14px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:12px}#modal.on{display:flex}
.mbox{background:var(--card);color:var(--ink);width:100%;max-width:560px;border-radius:8px;padding:16px;margin-bottom:env(safe-area-inset-bottom)}
.mbox textarea{width:100%;font:14px/1.6 var(--body);padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);resize:vertical}
.end h2{font-size:24px}.clear{border-left-color:var(--lamp);text-align:center}.clear .row{justify-content:center}
.yr{font:84px/1 var(--dot);color:var(--dirt);margin:4px 0 8px}.yr small{font-size:22px}
.board:empty{display:none}
.gc{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:var(--card);display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.gc .gh{grid-column:1/-1;display:flex;justify-content:space-between;font-family:var(--dot);font-size:18px}.gc p{margin:0}.gc button{min-width:84px}
.g-b{border-left:6px solid #A0714A}.g-s{border-left:6px solid #9AA4AE}.g-g{border-left:6px solid var(--lamp)}
.pull{text-align:center}.pull .pl{text-align:left}.rar{font:56px/1 var(--dot);margin:0}
.rN{color:var(--muted)}.rR{color:#3D6E92}.rSR{color:#C98A1A}.rSSR{color:#C0392B;animation:pop .6s ease-out}
.rUR{background:linear-gradient(90deg,#C0392B,#F2B33D,#6E9A2F,#3D6E92,#8E44AD);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .7s ease-out}
.lamps{display:flex;gap:10px;justify-content:center;margin:18px 0}.lamps i{width:26px;height:26px;border-radius:50%;background:var(--line);display:block;transition:.2s}
.lamps i.on{background:var(--lamp);box-shadow:0 0 14px var(--lamp)}.lamps i.on.l4{background:#C0392B;box-shadow:0 0 18px #C0392B}.lamps i.on.l5{background:#8E44AD;box-shadow:0 0 22px #8E44AD}
.scout{font:20px var(--dot);margin:6px 0}
.rules{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:10px 0;background:var(--bg)}.rules h3{margin-bottom:6px}.rules p{font-size:13px;margin:0 0 6px}
.lots{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin:14px 0}
.lot{min-height:96px;font:16px var(--dot);background:var(--board);color:var(--lamp);border:2px solid var(--lamp);border-radius:8px}
.feat{border:1px dashed var(--dirt);border-radius:6px;padding:8px 10px;margin-bottom:10px}.fp{display:inline-flex;gap:6px;align-items:baseline;border:1px solid var(--line);border-radius:4px;padding:4px 8px;margin:3px 4px 0 0;font-size:13px;cursor:pointer}.fp b{font-family:var(--dot)}
.gc .row button small{display:block;font-size:10px;opacity:.85}
.lr{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:4px}
.lr.sel{background:color-mix(in srgb,var(--lamp) 35%,transparent);outline:2px solid var(--lamp)}.lr.inj{opacity:.55}.lr.empty{color:var(--muted)}
.lr .no{font:18px var(--dot);width:30px;text-align:center;color:var(--dirt);flex:none}.nmw{flex:1;min-width:0;display:flex;flex-direction:column}.nmw b{font-size:15px}.nmw small{font-size:11px;color:var(--muted)}.nmw em{color:var(--neg);font-style:normal}
.lr .ln{font-size:11px;text-align:right;color:var(--muted);flex:none;line-height:1.4}.lr select{font:14px var(--body);padding:4px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);flex:none}
button.i{min-height:30px;padding:4px 8px;font-size:12px;background:none;color:var(--ink);border:1px solid var(--line);flex:none}
.warn{color:var(--neg);font-size:13px;margin:6px 0 0}.mt{margin-top:14px}
.br{display:grid;grid-template-columns:64px 1fr 28px 22px;gap:8px;align-items:center;font-size:13px;margin:4px 0}.br div{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.br i{display:block;height:100%}.br b{text-align:right;font-family:var(--dot);font-weight:400}.br em{font:13px var(--dot);font-style:normal;text-align:center;color:#fff;border-radius:3px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.kv span{background:var(--bg);border-radius:4px;padding:6px;text-align:center;font-size:11px;color:var(--muted)}.kv b{display:block;font:18px var(--dot);color:var(--ink)}
.pd{max-height:88vh;overflow-y:auto}.pd .top{display:flex;align-items:baseline;gap:8px}
.tb.click tr{cursor:pointer}.tb th.on{color:var(--dirt);font-weight:700}.tb th{cursor:pointer}
.aps{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.ap{text-align:center;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:3px 0}.ap b{display:block;font:15px var(--dot)}
.aA b,select.aA{color:#C0392B}.aB b,select.aB{color:#D9632B}.aC b,select.aC{color:#6E9A2F}.aD b,select.aD{color:#3D6E92}.aE b,select.aE{color:#7A7A7A}
.pol{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px;cursor:pointer}.pol span{font-size:12px;color:var(--muted)}.pol.on{border:2px solid var(--dirt);background:color-mix(in srgb,var(--dirt) 10%,transparent)}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.field{margin:2px 0 6px}.field svg{display:block;border-radius:8px;max-width:420px;margin:0 auto}
.grass{fill:#1f4d33}.of{fill:#2b6b45}.inf{fill:#2f7a4d}.dirt{fill:#8a5a34}.mound{fill:#a06a3d}.line{stroke:#fff;stroke-width:2;opacity:.55;fill:none}
.fpos circle{fill:#F7F5EA;stroke:#12281b;stroke-width:2}.fpos.sel circle{fill:var(--lamp);stroke:#12281b;stroke-width:3}
.fpos text{text-anchor:middle;font-family:var(--body);fill:#12281b}.fpos .ps{font-size:13px;font-weight:700}.fpos .pn{font-size:11px;fill:#F3F1E6;paint-order:stroke;stroke:#12281b;stroke-width:3px}
.fpos .pa{font-size:11px;font-family:var(--dot);fill:#F3F1E6;paint-order:stroke;stroke:#12281b;stroke-width:3px}
.fpos.aA circle{fill:#F7C9C2}.fpos.aB circle{fill:#F8DEC2}.fpos.aC circle{fill:#DCEFC6}.fpos.aD circle{fill:#CBDCEC}.fpos.aE circle{fill:#DCDCDC}
.fp-empty circle{fill:none;stroke:#F3F1E6;stroke-dasharray:4 3;stroke-width:2}.fp-empty text{text-anchor:middle;fill:#F3F1E6;font-size:12px}
.aptb{flex:none;font:13px var(--dot);border:1px solid var(--line);border-radius:4px;padding:3px 6px;min-width:44px;text-align:center}
.aptb.aA{background:#F7C9C2;color:#7d1f14}.aptb.aB{background:#F8DEC2;color:#7d4213}.aptb.aC{background:#DCEFC6;color:#2f5116}.aptb.aD{background:#CBDCEC;color:#1d3d59}.aptb.aE{background:#DCDCDC;color:#444}
.dh{text-align:center;font-size:13px;margin:8px 0 0}.dh b{border-bottom:2px solid var(--dirt);cursor:pointer}
.sb{background:var(--board);color:var(--chalk);border-color:#0b1a12}.sb .big{color:var(--lamp)}.sb .muted{color:#9fb3a5}
.sbrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rec{font-size:14px}.rec b{font:26px/1 var(--dot);color:var(--lamp)}.gbk{font-size:11px;text-align:right}.gbk b{font:22px var(--dot);color:var(--chalk)}
.pbar{height:8px;background:rgba(255,255,255,.15);border-radius:4px;margin:10px 0 4px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--lamp)}
.g-b .gh b{color:#A0714A}.g-s .gh b{color:#7d8790}.g-g .gh b{color:#C98A1A}
.g-g{background:linear-gradient(135deg,color-mix(in srgb,var(--lamp) 14%,var(--card)),var(--card))}
.g-s{background:linear-gradient(135deg,color-mix(in srgb,#9AA4AE 14%,var(--card)),var(--card))}
.g-b{background:linear-gradient(135deg,color-mix(in srgb,#A0714A 12%,var(--card)),var(--card))}
.hero{position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:repeating-linear-gradient(90deg,var(--dirt) 0 10px,transparent 10px 18px)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

  (S.hist.length?`<section class="card"><h3>球団の歩み</h3><div class="tw"><table class="tb"><tr><th>年</th><th>成績</th><th>順位</th><th>収支</th><th>人気</th></tr>${S.hist.map(x=>`<tr><td>${x.y}</td><td>${x.w}-${x.l}-${x.t}</td><td>${x.rk}位${x.js?'🏆':''}</td><td>${yen(x.bal)}</td><td>${x.pop}</td></tr>`).join('')}</table></div></section>`:'');
 return h+`<section class="card">${logs(120)}</section><p class="reset"><button class="ghost" onclick="resetGame()">最初からやり直す</button></p>`}
function vSetup(){return`<section class="hero"><h1>ボールパーク<br>オーナーズ<span>2026</span></h1><p>プロ野球12球団の全選手（2025年一軍成績から能力を推定）がいる世界に、13番目の球団として参入。弱小からの経営で、何年目に日本一になれるか。</p></section>
 <section class="card lead"><label class="fl">球団名<input id="tn" maxlength="12" value="" placeholder="球団名を入力"></label>
 <label class="fl">本拠地<select id="ht" onchange="document.getElementById('htd').textContent=HT[this.value].d+'（'+HT[this.value].cap.toLocaleString()+'席）'">${Object.keys(HT).map(k=>`<option>${k}</option>`).join('')}</select></label><p class="small" id="htd">${HT['首都圏'].d}（30,000席）</p>
 <label class="fl">参入リーグ<select id="lg"><option value="C">セ・リーグ</option><option value="P">パ・リーグ</option></select></label>
 <div class="rules"><h3>遊び方</h3>
 <p><b>🏆 クリア</b>　日本一になればゲームクリア。何年目で達成できるかを競います。</p>
 <p><b>💀 ゲームオーバー</b>　年度末（シーズン終了後の決算）に資金がマイナスなら経営破綻で終了。資金がマイナスでもシーズン中は続けられます。</p>
 <p><b>⚾ 流れ</b>　1年目は各球団の控え選手を集めた最下位クラスの戦力から。入場料・グッズ・スポンサー収入を伸ばし、補強ガチャとドラフトで戦力を上げていきます。</p>
 <p><b>🎛 できること</b>　年度初めに補強・ドラフト・経営方針（施策とチケット価格・球場改修）・起用（打順と守備位置、先発ローテと抑え）を決めます。起用はシーズン中も変更できます。</p></div>
 <button onclick="if(!document.getElementById('tn').value.trim()){toast('球団名を入力してください');return}newGame(document.getElementById('tn').value.trim(),document.getElementById('ht').value,document.getElementById('lg').value);S.v=5;S.fin.pol='none';startPrep(true);TAB='home';save();render()">球団を結成する</button></section>`}
function resetGame(){ask('セーブデータを消して最初からやり直しますか？',()=>{try{localStorage.removeItem(KEY)}catch(e){}S=null;TAB='home';render()})}
function render(){const app=document.getElementById('app');
 if(!S){app.innerHTML=vSetup();return}
 const v=TAB==='home'?vHome():TAB==='play'?vPlay():TAB==='team'?vTeam():vRec();
 app.innerHTML=head()+`<main>${v}</main>`+nav();
}
load();render();
</script></body></html>
